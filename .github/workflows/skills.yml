name: skills

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate skills and manifests
        run: python scripts/validate.py
      - name: Smoke-test installer
        run: |
          export CLAUDE_SKILLS_DIR="$RUNNER_TEMP/skills"
          scripts/install.sh
          scripts/install.sh --list
          scripts/install.sh --uninstall

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zips
        run: scripts/package.sh
      - name: Publish GitHub release with zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "$GITHUB_REF_NAME"
